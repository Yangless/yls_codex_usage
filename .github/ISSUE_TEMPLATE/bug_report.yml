name: Bug report
description: Report a reproducible defect in the application, build, or repository tooling.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing a bug. Please provide enough detail for someone unfamiliar with your machine to reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and why is it a problem?
      placeholder: A clear and concise summary of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Open the app
        2. Enter ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe what actually happened, including visible errors.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows desktop
        - Linux desktop
        - macOS desktop
        - iOS
        - Other / unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App or commit version
      description: Release version, git commit, or branch name.
      placeholder: main / v0.1.0 / commit SHA

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include OS version, Node, pnpm, Rust, and anything else relevant.
      placeholder: |
        OS:
        Node:
        pnpm:
        Rust:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Paste logs or attach screenshots if available. Remove secrets before submitting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed secrets, API keys, and private local paths from logs and screenshots.
          required: true
