version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies
      - github-actions
