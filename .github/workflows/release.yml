name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "8.15.9"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: ""
            tauri_args: "--bundles nsis"
            asset_platform: "windows"
            asset_arch: "x64"
          - name: Linux x64
            os: ubuntu-24.04
            rust_targets: ""
            tauri_args: ""
            asset_platform: "linux"
            asset_arch: "x64"
          - name: macOS Apple Silicon
            os: macos-latest
            rust_targets: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "aarch64"
          - name: macOS Intel
            os: macos-15-intel
            rust_targets: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify Node.js and pnpm
        run: |
          node --version
          corepack --version
          pnpm --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm tauri build -- ${{ matrix.tauri_args }}

      - name: Stage renamed assets on Unix runners
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          rust_target="${{ matrix.rust_targets }}"
          if [[ -n "$rust_target" ]]; then
            bundle_dir="src-tauri/target/$rust_target/release/bundle"
          else
            bundle_dir="src-tauri/target/release/bundle"
          fi

          upload_dir="src-tauri/target/release-upload"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          shopt -s nullglob

          stage_asset() {
            local source_path="$1"
            local target_name="$2"
            cp "$source_path" "$upload_dir/$target_name"
          }

          assert_exactly_one() {
            local label="$1"
            shift
            local matches=("$@")
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly 1 %s in %s, found %s\n' "$label" "$bundle_dir" "${#matches[@]}" >&2
              printf 'Matches: %s\n' "${matches[*]:-<none>}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          assert_absent() {
            local label="$1"
            shift
            local matches=("$@")
            if [[ ${#matches[@]} -ne 0 ]]; then
              printf 'Expected no %s in %s, found %s\n' "$label" "$bundle_dir" "${#matches[@]}" >&2
              printf 'Matches: %s\n' "${matches[*]}" >&2
              exit 1
            fi
          }

          appimages=("$bundle_dir"/appimage/*.AppImage)
          debs=("$bundle_dir"/deb/*.deb)
          rpms=("$bundle_dir"/rpm/*.rpm)
          dmgs=("$bundle_dir"/dmg/*.dmg)
          app_tars=("$bundle_dir"/macos/*.app.tar.gz)

          if [[ "${{ matrix.asset_platform }}" == "linux" ]]; then
            appimage="$(assert_exactly_one 'AppImage' "${appimages[@]}")"
            deb="$(assert_exactly_one 'deb package' "${debs[@]}")"
            rpm="$(assert_exactly_one 'rpm package' "${rpms[@]}")"
            assert_absent 'dmg bundle' "${dmgs[@]}"
            assert_absent 'macOS app tarball' "${app_tars[@]}"

            stage_asset "$appimage" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_appimage.AppImage"
            stage_asset "$deb" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.deb"
            stage_asset "$rpm" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.rpm"
          else
            assert_absent 'AppImage' "${appimages[@]}"
            assert_absent 'deb package' "${debs[@]}"
            assert_absent 'rpm package' "${rpms[@]}"
            dmg="$(assert_exactly_one 'dmg bundle' "${dmgs[@]}")"
            app_tar="$(assert_exactly_one 'macOS app tarball' "${app_tars[@]}")"

            stage_asset "$dmg" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.dmg"
            stage_asset "$app_tar" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_app.tar.gz"
          fi

          staged_files=("$upload_dir"/*)
          if [[ ${#staged_files[@]} -eq 0 ]]; then
            echo "No staged assets found in $upload_dir" >&2
            exit 1
          fi

      - name: Stage renamed assets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $uploadDir = 'src-tauri/target/release-upload'

          if (Test-Path $uploadDir) {
            Remove-Item -LiteralPath $uploadDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $uploadDir | Out-Null

          $installers = @(Get-ChildItem -Path $bundleDir -Filter *.exe)
          if ($installers.Count -ne 1) {
            $names = if ($installers.Count) { $installers.Name -join ', ' } else { '<none>' }
            throw "Expected exactly one NSIS installer in $bundleDir, found $($installers.Count): $names"
          }

          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $uploadDir "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_setup.exe")

      - name: Upload renamed release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codex 用量查询 ${{ env.RELEASE_TAG }}
          body: |
            Automated desktop release for ${{ env.RELEASE_TAG }}.

            Assets include Windows, Linux, and macOS bundles built by GitHub Actions.
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
