name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "8.15.9"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify release tag exists
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Verified tag ${tag}.`);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Tag ${tag} does not exist in ${context.repo.owner}/${context.repo.repo}.`);
                return;
              }

              throw error;
            }

  release:
    name: Release ${{ matrix.name }}
    needs: verify-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: ""
            tauri_args: "--bundles nsis"
            asset_platform: "windows"
            asset_arch: "x64"
          - name: Linux x64
            os: ubuntu-24.04
            rust_targets: ""
            tauri_args: ""
            asset_platform: "linux"
            asset_arch: "x64"
          - name: macOS Apple Silicon
            os: macos-15
            rust_targets: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "aarch64"
          - name: macOS Intel
            os: macos-15-intel
            rust_targets: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify Node.js and pnpm
        run: |
          node --version
          corepack --version
          pnpm --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        id: tauri_build
        uses: tauri-apps/tauri-action@97cef2bd32ead607bcc2c6af5b40ce2f25d48e77
        with:
          args: ${{ matrix.tauri_args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: release-[platform]-[arch]-[bundle]

  finalize-release:
    name: Finalize release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download staged release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*

      - name: Stage renamed release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="${RELEASE_TAG#v}"
          artifacts_dir="release-artifacts"
          upload_dir="release-staged"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          windows_setup_count=0
          linux_appimage_count=0
          linux_deb_count=0
          linux_rpm_count=0
          macos_x64_dmg_count=0
          macos_aarch64_dmg_count=0
          macos_x64_app_count=0
          macos_aarch64_app_count=0

          stage_copy() {
            local source_path="$1"
            local target_name="$2"
            local destination="$upload_dir/$target_name"
            if [[ -e "$destination" ]]; then
              printf 'Refusing to overwrite staged asset %s\n' "$destination" >&2
              exit 1
            fi
            cp -R "$source_path" "$destination"
          }

          assert_exactly_one() {
            local label="$1"
            shift
            local matches=("$@")
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly 1 %s, found %s\n' "$label" "${#matches[@]}" >&2
              printf 'Matches: %s\n' "${matches[*]:-<none>}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          for artifact_dir in "$artifacts_dir"/*; do
            [[ -d "$artifact_dir" ]] || continue

            artifact_name="$(basename "$artifact_dir")"

            case "$artifact_name" in
              release-windows-x64-nsis|release-windows-x86_64-nsis|release-windows-amd64-nsis)
                ((windows_setup_count+=1))
                installer="$(assert_exactly_one "Windows NSIS installer in $artifact_name" "$artifact_dir"/*.exe)"
                stage_copy "$installer" "yls_codex_usage_${version}_windows_x64_setup.exe"
                ;;
              release-linux-x64-appimage|release-linux-x86_64-appimage|release-linux-amd64-appimage)
                ((linux_appimage_count+=1))
                appimage="$(assert_exactly_one "Linux AppImage in $artifact_name" "$artifact_dir"/*.AppImage)"
                stage_copy "$appimage" "yls_codex_usage_${version}_linux_x64_appimage.AppImage"
                ;;
              release-linux-x64-deb|release-linux-x86_64-deb|release-linux-amd64-deb)
                ((linux_deb_count+=1))
                deb="$(assert_exactly_one "Linux deb in $artifact_name" "$artifact_dir"/*.deb)"
                stage_copy "$deb" "yls_codex_usage_${version}_linux_x64.deb"
                ;;
              release-linux-x64-rpm|release-linux-x86_64-rpm|release-linux-amd64-rpm)
                ((linux_rpm_count+=1))
                rpm="$(assert_exactly_one "Linux rpm in $artifact_name" "$artifact_dir"/*.rpm)"
                stage_copy "$rpm" "yls_codex_usage_${version}_linux_x64.rpm"
                ;;
              release-macos-x64-dmg|release-macos-x86_64-dmg|release-macos-amd64-dmg|release-darwin-x64-dmg|release-darwin-x86_64-dmg|release-darwin-amd64-dmg)
                ((macos_x64_dmg_count+=1))
                dmg="$(assert_exactly_one "macOS x64 dmg in $artifact_name" "$artifact_dir"/*.dmg)"
                stage_copy "$dmg" "yls_codex_usage_${version}_macos_x64.dmg"
                ;;
              release-macos-aarch64-dmg|release-darwin-aarch64-dmg)
                ((macos_aarch64_dmg_count+=1))
                dmg="$(assert_exactly_one "macOS aarch64 dmg in $artifact_name" "$artifact_dir"/*.dmg)"
                stage_copy "$dmg" "yls_codex_usage_${version}_macos_aarch64.dmg"
                ;;
              release-macos-x64-app|release-macos-x86_64-app|release-macos-amd64-app|release-darwin-x64-app|release-darwin-x86_64-app|release-darwin-amd64-app)
                ((macos_x64_app_count+=1))
                target_app_tar="$upload_dir/yls_codex_usage_${version}_macos_x64_app.tar.gz"
                app_tars=("$artifact_dir"/*.app.tar.gz)
                app_bundles=("$artifact_dir"/*.app)
                total_app_candidates=$(( ${#app_tars[@]} + ${#app_bundles[@]} ))
                if [[ $total_app_candidates -ne 1 ]]; then
                  printf 'Expected exactly 1 macOS x64 app candidate in %s, found %s\n' "$artifact_name" "$total_app_candidates" >&2
                  printf 'App tar matches: %s\n' "${app_tars[*]:-<none>}" >&2
                  printf 'App bundle matches: %s\n' "${app_bundles[*]:-<none>}" >&2
                  exit 1
                fi
                if [[ ${#app_tars[@]} -eq 1 ]]; then
                  stage_copy "${app_tars[0]}" "$(basename "$target_app_tar")"
                else
                  app_bundle="${app_bundles[0]}"
                  app_bundle_parent="$(dirname "$app_bundle")"
                  app_bundle_name="$(basename "$app_bundle")"
                  tar -C "$app_bundle_parent" -czf "$target_app_tar" "$app_bundle_name"
                fi
                ;;
              release-macos-aarch64-app|release-darwin-aarch64-app)
                ((macos_aarch64_app_count+=1))
                target_app_tar="$upload_dir/yls_codex_usage_${version}_macos_aarch64_app.tar.gz"
                app_tars=("$artifact_dir"/*.app.tar.gz)
                app_bundles=("$artifact_dir"/*.app)
                total_app_candidates=$(( ${#app_tars[@]} + ${#app_bundles[@]} ))
                if [[ $total_app_candidates -ne 1 ]]; then
                  printf 'Expected exactly 1 macOS aarch64 app candidate in %s, found %s\n' "$artifact_name" "$total_app_candidates" >&2
                  printf 'App tar matches: %s\n' "${app_tars[*]:-<none>}" >&2
                  printf 'App bundle matches: %s\n' "${app_bundles[*]:-<none>}" >&2
                  exit 1
                fi
                if [[ ${#app_tars[@]} -eq 1 ]]; then
                  stage_copy "${app_tars[0]}" "$(basename "$target_app_tar")"
                else
                  app_bundle="${app_bundles[0]}"
                  app_bundle_parent="$(dirname "$app_bundle")"
                  app_bundle_name="$(basename "$app_bundle")"
                  tar -C "$app_bundle_parent" -czf "$target_app_tar" "$app_bundle_name"
                fi
                ;;
              *)
                printf 'Ignoring workflow artifact directory: %s\n' "$artifact_name"
                ;;
            esac
          done

          [[ $windows_setup_count -eq 1 ]] || { printf 'Expected exactly 1 Windows NSIS artifact directory, found %s\n' "$windows_setup_count" >&2; exit 1; }
          [[ $linux_appimage_count -eq 1 ]] || { printf 'Expected exactly 1 Linux AppImage artifact directory, found %s\n' "$linux_appimage_count" >&2; exit 1; }
          [[ $linux_deb_count -eq 1 ]] || { printf 'Expected exactly 1 Linux deb artifact directory, found %s\n' "$linux_deb_count" >&2; exit 1; }
          [[ $linux_rpm_count -eq 1 ]] || { printf 'Expected exactly 1 Linux rpm artifact directory, found %s\n' "$linux_rpm_count" >&2; exit 1; }
          [[ $macos_x64_dmg_count -eq 1 ]] || { printf 'Expected exactly 1 macOS x64 dmg artifact directory, found %s\n' "$macos_x64_dmg_count" >&2; exit 1; }
          [[ $macos_aarch64_dmg_count -eq 1 ]] || { printf 'Expected exactly 1 macOS aarch64 dmg artifact directory, found %s\n' "$macos_aarch64_dmg_count" >&2; exit 1; }
          [[ $macos_x64_app_count -eq 1 ]] || { printf 'Expected exactly 1 macOS x64 app artifact directory, found %s\n' "$macos_x64_app_count" >&2; exit 1; }
          [[ $macos_aarch64_app_count -eq 1 ]] || { printf 'Expected exactly 1 macOS aarch64 app artifact directory, found %s\n' "$macos_aarch64_app_count" >&2; exit 1; }

          staged_files=("$upload_dir"/*)
          if [[ ${#staged_files[@]} -ne 8 ]]; then
            printf 'Expected exactly 8 staged release assets, found %s\n' "${#staged_files[@]}" >&2
            printf 'Staged files: %s\n' "${staged_files[*]:-<none>}" >&2
            exit 1
          fi

      - name: Publish release metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codex 用量查询 ${{ env.RELEASE_TAG }}
          body: |
            Automated desktop release for ${{ env.RELEASE_TAG }}.

            Assets include Windows, Linux, and macOS bundles built by GitHub Actions.
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-staged/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove legacy malformed assets
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = tag.replace(/^v/, '');

            const namesToDelete = new Set([
              `Codex._${version}_x64-setup.exe`,
              `Codex._${version}_amd64.AppImage`,
              `Codex._${version}_amd64.deb`,
              `Codex.-${version}-1.x86_64.rpm`,
              `Codex._${version}_x64.dmg`,
              'Codex._x64.app.tar.gz',
              `Codex._${version}_aarch64.dmg`,
              'Codex._aarch64.app.tar.gz',
            ]);

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist. Nothing to clean up.`);
                return;
              }
              throw error;
            }

            for (const asset of release.assets) {
              if (!namesToDelete.has(asset.name)) {
                continue;
              }

              core.info(`Deleting legacy asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }
