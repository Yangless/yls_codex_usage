name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "8.15.9"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify release tag exists
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Verified tag ${tag}.`);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Tag ${tag} does not exist in ${context.repo.owner}/${context.repo.repo}.`);
                return;
              }

              throw error;
            }

  release:
    name: Release ${{ matrix.name }}
    needs: verify-release-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: ""
            tauri_args: "--bundles nsis"
            asset_platform: "windows"
            asset_arch: "x64"
          - name: Linux x64
            os: ubuntu-24.04
            rust_targets: ""
            tauri_args: ""
            asset_platform: "linux"
            asset_arch: "x64"
          - name: macOS Apple Silicon
            os: macos-15
            rust_targets: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "aarch64"
          - name: macOS Intel
            os: macos-15-intel
            rust_targets: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify Node.js and pnpm
        run: |
          node --version
          corepack --version
          pnpm --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        id: tauri_build
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          args: ${{ matrix.tauri_args }}

      - name: Stage renamed assets on Unix runners
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          upload_dir="src-tauri/target/release-upload"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          mapfile -t artifact_paths < <(
            python - <<'PY'
import json
import os
import sys

raw = os.environ.get("TAURI_ARTIFACT_PATHS", "").strip()
if not raw:
    sys.exit("TAURI_ARTIFACT_PATHS is empty")

paths = None
try:
    parsed = json.loads(raw)
    if isinstance(parsed, list):
        paths = [str(item) for item in parsed]
    elif isinstance(parsed, str):
        paths = [parsed]
except json.JSONDecodeError:
    paths = [line.strip() for line in raw.splitlines() if line.strip()]

for path in paths:
    print(path)
PY
          )

          stage_asset() {
            local source_path="$1"
            local target_name="$2"
            cp "$source_path" "$upload_dir/$target_name"
          }

          assert_exactly_one() {
            local label="$1"
            shift
            local matches=("$@")
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected exactly 1 %s from tauri artifactPaths, found %s\n' "$label" "${#matches[@]}" >&2
              printf 'Matches: %s\n' "${matches[*]:-<none>}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          assert_absent() {
            local label="$1"
            shift
            local matches=("$@")
            if [[ ${#matches[@]} -ne 0 ]]; then
              printf 'Expected no %s from tauri artifactPaths, found %s\n' "$label" "${#matches[@]}" >&2
              printf 'Matches: %s\n' "${matches[*]}" >&2
              exit 1
            fi
          }

          appimages=()
          debs=()
          rpms=()
          dmgs=()
          app_tars=()

          for path in "${artifact_paths[@]}"; do
            case "$path" in
              *.AppImage) appimages+=("$path") ;;
              *.deb) debs+=("$path") ;;
              *.rpm) rpms+=("$path") ;;
              *.app.tar.gz) app_tars+=("$path") ;;
              *.dmg) dmgs+=("$path") ;;
            esac
          done

          if [[ "${{ matrix.asset_platform }}" == "linux" ]]; then
            appimage="$(assert_exactly_one 'AppImage' "${appimages[@]}")"
            deb="$(assert_exactly_one 'deb package' "${debs[@]}")"
            rpm="$(assert_exactly_one 'rpm package' "${rpms[@]}")"
            assert_absent 'dmg bundle' "${dmgs[@]}"
            assert_absent 'macOS app tarball' "${app_tars[@]}"

            stage_asset "$appimage" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_appimage.AppImage"
            stage_asset "$deb" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.deb"
            stage_asset "$rpm" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.rpm"
          else
            assert_absent 'AppImage' "${appimages[@]}"
            assert_absent 'deb package' "${debs[@]}"
            assert_absent 'rpm package' "${rpms[@]}"
            dmg="$(assert_exactly_one 'dmg bundle' "${dmgs[@]}")"
            app_tar="$(assert_exactly_one 'macOS app tarball' "${app_tars[@]}")"

            stage_asset "$dmg" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.dmg"
            stage_asset "$app_tar" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_app.tar.gz"
          fi

          staged_files=("$upload_dir"/*)
          if [[ ${#staged_files[@]} -eq 0 ]]; then
            echo "No staged assets found in $upload_dir" >&2
            exit 1
          fi

      - name: Stage renamed assets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $uploadDir = 'src-tauri/target/release-upload'

          if (Test-Path $uploadDir) {
            Remove-Item -LiteralPath $uploadDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $uploadDir | Out-Null

          $rawArtifactPaths = $env:TAURI_ARTIFACT_PATHS
          if ([string]::IsNullOrWhiteSpace($rawArtifactPaths)) {
            throw 'TAURI_ARTIFACT_PATHS is empty.'
          }

          try {
            $parsedArtifactPaths = $rawArtifactPaths | ConvertFrom-Json
            if ($parsedArtifactPaths -is [string]) {
              $artifactPaths = @($parsedArtifactPaths)
            }
            else {
              $artifactPaths = @($parsedArtifactPaths)
            }
          }
          catch {
            $artifactPaths = @(
              $rawArtifactPaths -split "`r?`n" |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }

          $installers = @($artifactPaths | Where-Object { $_ -like '*.exe' })
          if ($installers.Count -ne 1) {
            $names = if ($installers.Count) { $installers -join ', ' } else { '<none>' }
            throw "Expected exactly one NSIS installer from tauri artifactPaths, found $($installers.Count): $names"
          }

          Copy-Item -LiteralPath $installers[0] -Destination (Join-Path $uploadDir "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_setup.exe")

      - name: Upload renamed assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}
          if-no-files-found: error
          path: |
            src-tauri/target/release-upload/*

  finalize-release:
    name: Finalize release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download staged release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-assets-*
          merge-multiple: true

      - name: Publish release metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codex 用量查询 ${{ env.RELEASE_TAG }}
          body: |
            Automated desktop release for ${{ env.RELEASE_TAG }}.

            Assets include Windows, Linux, and macOS bundles built by GitHub Actions.
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove legacy malformed assets
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = tag.replace(/^v/, '');

            const namesToDelete = new Set([
              `Codex._${version}_x64-setup.exe`,
              `Codex._${version}_amd64.AppImage`,
              `Codex._${version}_amd64.deb`,
              `Codex.-${version}-1.x86_64.rpm`,
              `Codex._${version}_x64.dmg`,
              'Codex._x64.app.tar.gz',
              `Codex._${version}_aarch64.dmg`,
              'Codex._aarch64.app.tar.gz',
            ]);

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist. Nothing to clean up.`);
                return;
              }
              throw error;
            }

            for (const asset of release.assets) {
              if (!namesToDelete.has(asset.name)) {
                continue;
              }

              core.info(`Deleting legacy asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }
