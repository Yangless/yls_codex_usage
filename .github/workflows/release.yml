name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "8.15.9"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  cleanup-release-assets:
    name: Prepare release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove existing assets for this tag
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              if (!release.assets.length) {
                core.info(`Release ${tag} exists but has no assets to delete.`);
                return;
              }

              for (const asset of release.assets) {
                core.info(`Deleting existing asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist yet. Nothing to clean up.`);
                return;
              }

              throw error;
            }

  release:
    name: Release ${{ matrix.name }}
    needs: cleanup-release-assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: ""
            tauri_args: "--bundles nsis"
            asset_platform: "windows"
            asset_arch: "x64"
          - name: Linux x64
            os: ubuntu-24.04
            rust_targets: ""
            tauri_args: ""
            asset_platform: "linux"
            asset_arch: "x64"
          - name: macOS Apple Silicon
            os: macos-latest
            rust_targets: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "aarch64"
          - name: macOS Intel
            os: macos-15-intel
            rust_targets: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            asset_platform: "macos"
            asset_arch: "x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Verify Node.js and pnpm
        run: |
          node --version
          corepack --version
          pnpm --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        run: pnpm tauri build -- ${{ matrix.tauri_args }}

      - name: Stage renamed assets on Unix runners
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          rust_target="${{ matrix.rust_targets }}"
          if [[ -n "$rust_target" ]]; then
            bundle_dir="src-tauri/target/$rust_target/release/bundle"
          else
            bundle_dir="src-tauri/target/release/bundle"
          fi

          upload_dir="src-tauri/target/release-upload"
          rm -rf "$upload_dir"
          mkdir -p "$upload_dir"

          shopt -s nullglob

          stage_asset() {
            local source_path="$1"
            local target_name="$2"
            cp "$source_path" "$upload_dir/$target_name"
          }

          for file in "$bundle_dir"/appimage/*.AppImage; do
            stage_asset "$file" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_appimage.AppImage"
          done

          for file in "$bundle_dir"/deb/*.deb; do
            stage_asset "$file" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.deb"
          done

          for file in "$bundle_dir"/rpm/*.rpm; do
            stage_asset "$file" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.rpm"
          done

          for file in "$bundle_dir"/dmg/*.dmg; do
            stage_asset "$file" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}.dmg"
          done

          for file in "$bundle_dir"/macos/*.app.tar.gz; do
            stage_asset "$file" "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_app.tar.gz"
          done

          compgen -G "$upload_dir/*" > /dev/null

      - name: Stage renamed assets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $uploadDir = 'src-tauri/target/release-upload'

          if (Test-Path $uploadDir) {
            Remove-Item -LiteralPath $uploadDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $uploadDir | Out-Null

          $installer = Get-ChildItem -Path $bundleDir -Filter *.exe | Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer not found.'
          }

          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $uploadDir "yls_codex_usage_${version}_${{ matrix.asset_platform }}_${{ matrix.asset_arch }}_setup.exe")

      - name: Upload renamed release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codex 用量查询 ${{ env.RELEASE_TAG }}
          body: |
            Automated desktop release for ${{ env.RELEASE_TAG }}.

            Assets include Windows, Linux, and macOS bundles built by GitHub Actions.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
